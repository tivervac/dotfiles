# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,5120x1440@240,auto,1,vrr,1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = tofi-drun --drun-launch=true


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = ~/.config/hypr/unlock-keyring.sh
exec-once = waybar
exec-once = firefox
exec-once = [workspace special silent] exec obsidian
exec-once = rambox
exec-once = [workspace special silent] exec signal-desktop
exec-once = $terminal
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = [workspace 2 silent] exec vivaldi --no-first-run --new-window 'https://meet.google.com/landing?authuser=1'
# For Japanese input
exec-once = fcitx5
# This should autostart, but it doesn't :'(
exec-once = systemctl start hypridle --user
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 0
    gaps_out = 0

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    orientation = center
    # Center window takes 50% of 5120 = 2560px (one 1440p screen),
    # leaving 1280px (half a screen) for each side column.
    mfact = 0.5
    # Only go 3-column once there are 2+ side windows...
    slave_count_for_center_master = 2
    # ...with 2 windows total, fall back to a plain 50/50 left/right split.
    center_master_fallback = left
    # New windows join the side columns instead of stealing the center.
    new_status = slave
    smart_resizing = true
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = colemak
    kb_model =
    kb_options =
    kb_rules =
    kb_options   = grp:alt_shift_toggle   # e.g. Alt+Shift to switch if you ever add more layout

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/#keywords
$mainMod = SUPER # Sets "Windows" key as main modifier
$function = FN

# Example binds, see https://wiki.hypr.land/Configuring/Basics/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,

# Master layout: https://wiki.hypr.land/Configuring/Layouts/Master-Layout/
# Promote the focused window into the big center column
bind = $mainMod, Return, layoutmsg, swapwithmaster master
# Widen / narrow the center column
binde = $mainMod, minus, layoutmsg, mfact -0.025
binde = $mainMod, equal, layoutmsg, mfact +0.025
# Reset the center column to exactly half the screen
bind = $mainMod, 0, layoutmsg, mfact exact 0.5
# Shuffle windows around the ring without changing focus
bind = $mainMod SHIFT, left, layoutmsg, swapnext
bind = $mainMod SHIFT, right, layoutmsg, swapprev
bind = $mainMod, F, exec, $menu
bind = $mainMod, L, exec, pidof hyprlock || hyprlock

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, special
bind = $mainMod SHIFT, S, movetoworkspace, special:special

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hide taskbar on Super+B
bind = $mainMod, B, exec, killall -SIGUSR1 waybar

# Screenshot
bindl=, Print, exec, grimblast --freeze copysave area
# Screencast
bindl=, Insert, exec, pkill --signal SIGINT wf-recorder || wf-recorder -f ~/Videos/recording-$(date +%F_%T).mkv -g "$(slurp)"

# Volume control
# Increase volume
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+

# Lower volume
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Mute music
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Play and pause
bindl=, XF86AudioPlay, exec, playerctl play-pause

# Next song
bindl=, XF86AudioNext, exec, playerctl next

# Previous song
bindl=, XF86AudioPrev, exec, playerctl previous

